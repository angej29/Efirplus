name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack sources
        run: |
          f=$(git log -1 --format= --name-only --diff-filter=AM -- 'src*.zip' | grep -v '^$' | head -1)
          echo "Archive: $f"
          unzip -o -q "$f"
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Efir-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Efir-apk
          path: Efir-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Efir build ${{ github.run_number }}
          files: Efir-${{ github.run_number }}.apk

      - name: Прибрати старі архіви
        run: |
          f=$(git log -1 --format= --name-only --diff-filter=AM -- 'src*.zip' | grep -v '^$' | head -1)
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for z in src*.zip; do
            if [ "$z" != "$f" ]; then git rm -q "$z"; fi
          done
          git commit -m "Прибрано старі src-архіви" || true
          git push
